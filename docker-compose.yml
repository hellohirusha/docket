services:
  db:
    image: postgres:16-alpine
    container_name: docket_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: docket
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - rrs_pgdata:/var/lib/postgresql/data

volumes:
  rrs_pgdata:
