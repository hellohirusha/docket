services:
  db:
    image: postgres:16-alpine
    container_name: docket_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: docket
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - docket_pgdata:/var/lib/postgresql/data

volumes:
  docket_pgdata:
